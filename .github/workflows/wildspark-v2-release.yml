name: Build and publish WildSpark stable release

on:
  push:
    branches: [main, "release/**"]
    paths:
      - ".github/workflows/wildspark-v2-release.yml"
      - ".github/releases/v*.md"
      - "README.md"
      - "Wildspark/**"
      - "Wildspark/Menu.lua"
      - "Wildspark/Locales/**"
      - "Wildspark/WildSpark.toc"
      - "Wildspark/CHANGELOG.txt"
      - "Wildspark/Media/WildFire/tent_*.tga"
      - "Wildspark/Media/WildFire/circle_mask.tga"
      - "Wildspark/Modules/WildDrops/**"
      - "Wildspark/Modules/WildAuctions/**"
      - "Wildspark/Modules/WildGroupsNotifications.lua"

permissions:
  contents: write

concurrency:
  group: wildspark-stable-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out WildSpark
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release metadata and notices
        id: release
        run: |
          VERSION="$(sed -n 's/^## Version: //p' Wildspark/WildSpark.toc | head -n 1 | tr -d '\r')"
          test -n "$VERSION"
          TAG="v$VERSION"
          test -f ".github/releases/$TAG.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package WildSpark with embedded quest databases
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euxo pipefail
          mkdir -p dist/stage/WildSpark
          cp -a Wildspark/. dist/stage/WildSpark/
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/QuestDB.zip" "https://www.curseforge.com/api/v1/mods/1700352/files/9768606/download"
          mkdir -p "$RUNNER_TEMP/questdb-package"
          unzip -q "$RUNNER_TEMP/QuestDB.zip" -d "$RUNNER_TEMP/questdb-package"
          QDB_DIR="$RUNNER_TEMP/questdb-package/QuestDB"
          test -f "$QDB_DIR/QuestDB_Camelot.toc"
          test -f "$QDB_DIR/LibQuestDB-1.0.lua"
          test -f "$QDB_DIR/LICENSE"
          sed -i 's/\r$//' "$QDB_DIR/QuestDB_Camelot.toc"
          grep -Fx '## Version: QuestDB-v0.2.0' "$QDB_DIR/QuestDB_Camelot.toc"
          mkdir -p dist/stage/WildSpark/Libs/QuestDB
          cp -a "$QDB_DIR/." dist/stage/WildSpark/Libs/QuestDB/

          curl --fail --location --retry 3 --output "$RUNNER_TEMP/QuestieDB.zip" "https://www.curseforge.com/api/v1/mods/1696795/files/9793696/download"
          mkdir -p "$RUNNER_TEMP/questiedb-package"
          unzip -q "$RUNNER_TEMP/QuestieDB.zip" -d "$RUNNER_TEMP/questiedb-package"
          QIE_DIR="$RUNNER_TEMP/questiedb-package/QuestieDB"
          test -f "$QIE_DIR/QuestieDB_Forever.toc"
          sed -i 's/\r$//' "$QIE_DIR/QuestieDB_Forever.toc"
          if [ ! -f "$QIE_DIR/LICENSE.md" ]; then
            test -f "$QIE_DIR/gpl-3.0.md"
            cp "$QIE_DIR/gpl-3.0.md" "$QIE_DIR/LICENSE.md"
          fi
          test -f "$QIE_DIR/LICENSE.md"
          grep -q '^## Version: 1.1.6$' "$QIE_DIR/QuestieDB_Forever.toc"
          mkdir -p dist/stage/WildSpark/Libs/QuestieDB
          cp -a "$QIE_DIR/." dist/stage/WildSpark/Libs/QuestieDB/

          MAIN_TOC="dist/stage/WildSpark/WildSpark.toc"
          META_FILE="$RUNNER_TEMP/questiedb-metadata.txt"
          awk -F: '
            NR == FNR { if ($1 ~ /^## X-/) present[$1] = 1; next }
            /^## X-/ { if (!present[$1] && !seen[$1]++) print }
          ' "$MAIN_TOC" "$QIE_DIR/QuestieDB_Forever.toc" > "$META_FILE"
          awk -v meta_file="$META_FILE" '
            BEGIN {
              while ((getline line < meta_file) > 0) metadata = metadata line "\n"
              close(meta_file)
            }
            !inserted && NF && $0 !~ /^#/ {
              printf "%s", metadata
              inserted = 1
            }
            { print }
          ' "$MAIN_TOC" > "$RUNNER_TEMP/WildSpark.toc"
          mv "$RUNNER_TEMP/WildSpark.toc" "$MAIN_TOC"

          append_toc_files() {
            prefix="$1"
            source_toc="$2"
            while IFS= read -r line || [ -n "$line" ]; do
              line=${line%$'\r'}
              case "$line" in ""|\#*) continue ;; esac
              printf '%s%s\n' "$prefix" "$line" >> "$MAIN_TOC"
            done < "$source_toc"
          }
          append_toc_files 'Libs\QuestDB\' "$QDB_DIR/QuestDB_Camelot.toc"
          append_toc_files 'Libs\QuestieDB\' "$QIE_DIR/QuestieDB_Forever.toc"

          sed -i 's/\r$//' "$MAIN_TOC"
          grep -Fx "## Version: $VERSION" "$MAIN_TOC"
          grep -Fx '## X-WildFireKit-Version: 1.11.2' "$MAIN_TOC"
          grep -Fx '## X-WildRolls-Version: 1.3.4' "$MAIN_TOC"
          grep -Fx '## X-WildGroups-Version: 2.6.0' "$MAIN_TOC"
          grep -Fx '## X-Flavor: Forever' "$MAIN_TOC"
          grep -Fq 'Libs\QuestDB\Data\Forever\_core\Drops.lua' "$MAIN_TOC"
          grep -Fq 'Libs\QuestieDB\src\api.lua' "$MAIN_TOC"
          grep -Fqx 'Modules\WildMaps\Core\Lens.lua' "$MAIN_TOC"
          grep -Fqx 'Modules\WildMaps\Core\Engine.lua' "$MAIN_TOC"
          grep -Fqx 'Modules\WildMaps\UI\Triggers.lua' "$MAIN_TOC"
          grep -Fqx 'Modules\WildMaps\TargetTracking.lua' "$MAIN_TOC"
          test -f Wildspark/Modules/WildMaps/ForeverMinimapTarget-LICENSE.txt
          test -f Wildspark/Modules/WildMaps/ForeverMinimapTarget-ATTRIBUTION.md
          grep -Fqx 'Modules\WildDrops\Respawn.lua' "$MAIN_TOC"
          if grep -q 'WildPvP' "$MAIN_TOC"; then
            echo "WildPvP is archived and must not load in the active addon."
            exit 1
          fi
          if grep -Eqi 'WildLayer|AutoLayer|LeashHelper|LeashOptions' "$MAIN_TOC"; then
            echo "WildLayer and the Leash Timer are archived and must not load in the active addon."
            exit 1
          fi
          cd dist/stage
          zip -qr "../WildSpark-$VERSION.zip" WildSpark
          cd ../..
          test "$(unzip -Z1 "dist/WildSpark-$VERSION.zip" | awk -F/ '{print $1}' | sort -u)" = "WildSpark"
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/WildSpark.toc$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Libs/QuestDB/LibQuestDB-1.0.lua$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Libs/QuestDB/LICENSE$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Libs/QuestieDB/QuestieDB_Forever.toc$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Libs/QuestieDB/LICENSE.md$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Modules/WildDrops/QuestDropRates-LICENSE.txt$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Modules/WildMaps/Core/Lens.lua$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Modules/WildMaps/Core/Engine.lua$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Modules/WildMaps/UI/Triggers.lua$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Modules/WildMaps/TargetTracking.lua$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Modules/WildMaps/ForeverMinimapTarget-LICENSE.txt$'
          if unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -qE '^WildSpark/Modules/WildMaps/(UI/DungeonAtlas.lua|Data/Dungeons.lua|Data/Points.lua|Media/AtlasTiles/)'; then
            echo "The retired dungeon atlas must not be included in the active release ZIP."
            exit 1
          fi
          if unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -qE '^WildSpark/Modules/WildGear/'; then
            echo "Archived WildGear source must not be included in the active addon ZIP."
            exit 1
          fi
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Modules/WildDrops/Respawn.lua$'
          if unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -qE '^WildSpark/Modules/WildPvP'; then
            echo "Archived WildPvP source must not be packaged in the active addon."
            exit 1
          fi
          if unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -Eqi '^WildSpark/(Modules/WildLayer|LeashHelper|LeashOptions|LEASHHELPER_LICENSE)'; then
            echo "Archived WildLayer and Leash Timer source must not be packaged in the active addon."
            exit 1
          fi
          if unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -qE '^(WildPvP|Spy|Capping|Capping_Options|HighgroundBattlegrounds|BattleGroundEnemiesFixed)/'; then
            echo "Unexpected standalone PvP addon folder in the WildSpark release ZIP."
            exit 1
          fi
          grep -Fqx 'Modules\WildGroups\core\whisperlog.lua' "$MAIN_TOC"
          grep -Fqx 'Modules\WildGroupsInit.lua' "$MAIN_TOC"
          INIT_LINE="$(grep -nFx 'Modules\WildGroupsInit.lua' "$MAIN_TOC" | cut -d: -f1)"
          LOCALE_LINE="$(grep -nFx 'Modules\WildGroups\core\locale.lua' "$MAIN_TOC" | cut -d: -f1)"
          test "$INIT_LINE" -lt "$LOCALE_LINE"
          grep -Fqx 'Modules\WildGroups\core\activitynames.lua' "$MAIN_TOC"
          grep -Fqx 'Modules\WildGroups\core\settings.lua' "$MAIN_TOC"
          grep -Fqx 'Modules\WildGroups\core\filterpanel_search.lua' "$MAIN_TOC"
          grep -Fqx 'Modules\WildGroups\core\blizzardlisting.lua' "$MAIN_TOC"
          if grep -Eq 'LFGF\.(OpenForListing|CloseBlizzardGroupFinder)' Wildspark/Modules/WildGroups/core/blizzardlisting.lua; then
            echo "WildGroups must not automatically open or close its panel after a listing is posted."
            exit 1
          fi
          grep -Fqx 'LootRollMover.lua' "$MAIN_TOC"
          test -f Wildspark/Modules/WildRolls/NOTICE.md
          grep -Fq 'showVoteCounts' Wildspark/LootRollMover.lua
          grep -Fq 'showReceivedPreview' Wildspark/LootRollMover.lua
          grep -Fq 'GamepadGroupLootRollFrame' Wildspark/LootRollMover.lua
          grep -Fq 'EditModeManagerFrame' Wildspark/LootRollMover.lua
          grep -Fqx 'Modules\WildGroups\core\wholookup.lua' "$MAIN_TOC"
          grep -Fqx 'WildFireKitEmbedded\CampNet.lua' "$MAIN_TOC"
          grep -Fqx 'WildFireKitEmbedded\Camping.lua' "$MAIN_TOC"
          grep -Fqx 'WildFireKitEmbedded\Libs\KitCore\KitCore.lua' "$MAIN_TOC"
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Modules/WildGroups/core/whisperlog.lua$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Modules/WildGroupsInit.lua$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Modules/WildGroups/core/activitynames.lua$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Modules/WildGroups/core/settings.lua$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Modules/WildGroups/core/filterpanel_search.lua$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Modules/WildGroups/core/blizzardlisting.lua$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Modules/WildRolls/NOTICE.md$'
          unzip -p "dist/WildSpark-$VERSION.zip" WildSpark/LootRollMover.lua | grep -F 'function MOD.SetReceivedPreview' >/dev/null
          unzip -p "dist/WildSpark-$VERSION.zip" WildSpark/LootRollMover.lua | grep -F 'function MOD.SetStackUpwards' >/dev/null
          unzip -p "dist/WildSpark-$VERSION.zip" WildSpark/Modules/WildGroups/core/blizzardlisting.lua | grep -F 'Deliberately leave post-listing behavior to Blizzard.' >/dev/null
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/Modules/WildGroups/core/wholookup.lua$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/WildFireKitEmbedded/CampNet.lua$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/WildFireKitEmbedded/Camping.lua$'
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/WildFireKitEmbedded/Libs/KitCore/KitCore.lua$'
          if unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -qE '^(QuestDB|QuestieDB)/'; then
            echo "The quest database folders must remain embedded beneath WildSpark/Libs."
            exit 1
          fi

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/WildSpark-$VERSION.zip" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "WildSpark $VERSION — Stable release" \
              --notes-file ".github/releases/$TAG.md" --latest
          else
            gh release create "$TAG" "dist/WildSpark-$VERSION.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --title "WildSpark $VERSION — Stable release" \
              --notes-file ".github/releases/$TAG.md" \
              --target "$GITHUB_SHA" \
              --latest
          fi
