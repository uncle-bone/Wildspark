name: Build and publish WildSpark 2.0.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wildspark-v2-release.yml"

permissions:
  contents: write

concurrency:
  group: wildspark-v2-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out WildSpark
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release metadata and notices
        run: |
          grep -Fx '## Version: 2.0.0' Wildspark/WildSpark.toc
          test -f Wildspark/LICENSE.txt
          test -f Wildspark/Modules/WildAuctions/LICENSE.txt
          test -f Wildspark/Modules/WildGroups/LICENSE
          test -f Wildspark/Modules/WildLayer/LICENSE.txt
          test -f Wildspark/CampingKitEmbedded/LICENSE
          test -f Wildspark/CampingKitEmbedded/ARTWORK_NOTICE.txt
          test -f Wildspark/Media/WildFireIcon-LICENSE.txt

      - name: Package installable addon
        run: |
          mkdir -p dist/stage/WildSpark
          cp -a Wildspark/. dist/stage/WildSpark/
          cd dist/stage
          zip -qr ../WildSpark-2.0.0.zip WildSpark
          cd ../..
          unzip -Z1 dist/WildSpark-2.0.0.zip | grep -q '^WildSpark/WildSpark.toc$'

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0 dist/WildSpark-2.0.0.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "WildSpark 2.0.0 — Major update" \
            --notes-file .github/releases/v2.0.0.md \
            --target "$GITHUB_SHA" \
            --latest
