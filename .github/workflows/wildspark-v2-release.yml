name: Build and publish WildSpark stable release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wildspark-v2-release.yml"
      - ".github/releases/v*.md"
      - "README.md"
      - "Wildspark/WildSpark.toc"
      - "Wildspark/CHANGELOG.txt"
      - "Wildspark/Media/WildFire/tent_*.tga"

permissions:
  contents: write

concurrency:
  group: wildspark-stable-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out WildSpark
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release metadata and notices
        id: release
        run: |
          VERSION="$(sed -n 's/^## Version: //p' Wildspark/WildSpark.toc | head -n 1)"
          test -n "$VERSION"
          TAG="v$VERSION"
          grep -Fx "## Version: $VERSION" Wildspark/WildSpark.toc
          test -f Wildspark/LICENSE.txt
          test -f Wildspark/Modules/WildAuctions/LICENSE.txt
          test -f Wildspark/Modules/WildGroups/LICENSE
          test -f Wildspark/Modules/WildLayer/LICENSE.txt
          test -f Wildspark/CampingKitEmbedded/LICENSE
          test -f Wildspark/CampingKitEmbedded/ARTWORK_NOTICE.txt
          test -f Wildspark/Media/WildFireIcon-LICENSE.txt
          test -f ".github/releases/$TAG.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package installable addon
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p dist/stage/WildSpark
          cp -a Wildspark/. dist/stage/WildSpark/
          cd dist/stage
          zip -qr "../WildSpark-$VERSION.zip" WildSpark
          cd ../..
          unzip -Z1 "dist/WildSpark-$VERSION.zip" | grep -q '^WildSpark/WildSpark.toc$'

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping duplicate publish."
            exit 0
          fi
          gh release create "$TAG" "dist/WildSpark-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "WildSpark $VERSION — Stable release" \
            --notes-file ".github/releases/$TAG.md" \
            --target "$GITHUB_SHA" \
            --latest
