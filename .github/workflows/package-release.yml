name: Package WildSpark rollback release
on:
  push:
    branches: [main]
    paths:
      - "Wildspark/**"
      - "README.md"
      - ".github/workflows/package-release.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rollback-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Package and verify restored WildSpark
        id: package
        shell: bash
        run: |
          version="$(sed -n 's/^## Version: //p' Wildspark/Wildspark.toc | head -n 1)"
          test "$version" = "1.4.5"
          package="WildSpark-$version.zip"
          mkdir -p staging/WildSpark
          cp -a Wildspark/. staging/WildSpark/
          (cd staging && zip -qr "$GITHUB_WORKSPACE/$package" WildSpark)
          unzip -Z1 "$package" > package-files.txt
          grep -Fx "WildSpark/Wildspark.toc" package-files.txt
          unzip -p "$package" WildSpark/Wildspark.toc | grep -Fx "## Version: $version"
          if grep -q "^WildSpark/WildResources.lua$" package-files.txt; then exit 1; fi
          if grep -q "^WildSpark/ForeverLootRollMover.lua$" package-files.txt; then exit 1; fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - name: Publish restored version as latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v1.4.5"
          package="${{ steps.package.outputs.package }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$package" --clobber
          else
            gh release create "$tag" "$package" --title "WildSpark 1.4.5" --notes "Restored the pre-1.4.6 WildSpark source. This release removes the WildResources and ForeverLootRollMover additions from the prior experimental build." --target "$GITHUB_SHA" --latest
          fi
